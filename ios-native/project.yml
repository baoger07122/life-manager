name: HomeOSNative
options:
  bundleIdPrefix: com.bao
  xcodeVersion: "26.0"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  HomeOSNative:
    type: application
    platform: iOS
    sources:
      - path: HomeOSNative
        excludes:
          - Data/PreviewFixtures.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bao.homeos.native
        PRODUCT_NAME: Home OS Native
        MARKETING_VERSION: 0.1.11
        CURRENT_PROJECT_VERSION: 13
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Home OS Native
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
