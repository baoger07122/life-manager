name: Build Home OS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      render_url:
        description: "The HTTPS Render URL loaded by the native shell"
        required: false
        default: "https://life-manager-1.onrender.com/"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      RENDER_URL: ${{ inputs.render_url || 'https://life-manager-1.onrender.com/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Point the shell at the selected Render URL
        run: node -e "const fs=require('fs');const p='capacitor.config.ts';let s=fs.readFileSync(p,'utf8');s=s.replace(/url: \"[^\"]+\"/, 'url: \"'+process.env.RENDER_URL+'\"');fs.writeFileSync(p,s);"

      - name: Create and sync the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/HomeOS.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          rm -rf Payload HomeOS-unsigned.ipa
          mkdir -p Payload
          cp -R build/HomeOS.xcarchive/Products/Applications/App.app Payload/HomeOS.app
          ditto -c -k --sequesterRsrc --keepParent Payload HomeOS-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-os-unsigned-ipa
          path: HomeOS-unsigned.ipa
          if-no-files-found: error
