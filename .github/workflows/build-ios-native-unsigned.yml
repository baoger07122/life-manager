name: Build Home OS Native unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-native-v*"

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout native rewrite branch
        uses: actions/checkout@v4

      - name: Confirm the latest Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the native Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Read native version
        id: version
        working-directory: ios-native
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | head -n 1)"
          BUILD_NUMBER="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*//p' project.yml | head -n 1)"
          test -n "$VERSION"
          test -n "$BUILD_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build unsigned native app
        working-directory: ios-native
        run: |
          xcodebuild \
            -project HomeOSNative.xcodeproj \
            -scheme HomeOSNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned native IPA
        working-directory: ios-native
        run: |
          APP_PATH="$(find build/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/HomeOSNative.app
          ditto -c -k --sequesterRsrc --keepParent Payload "HomeOSNative-${{ steps.version.outputs.version }}-unsigned.ipa"

      - name: Publish versioned IPA to GitHub Releases
        working-directory: ios-native
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        shell: bash
        run: |
          TAG="ios-native-v${VERSION}"
          TITLE="Home OS Native ${VERSION} (${BUILD_NUMBER})"
          ASSET="HomeOSNative-${VERSION}-unsigned.ipa"
          NOTES=$'Home OS 原生 iOS 测试版本。\n\n此文件为未签名 IPA，需要使用第三方自签服务完成签名后安装。'

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "版本标签 $GITHUB_REF_NAME 与 project.yml 版本 $TAG 不一致。"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
