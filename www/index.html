<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Home OS</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f5f7; }
      body { color: #171a22; -webkit-user-select: none; user-select: none; }
      .boot {
        min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 20% 12%, rgba(98, 181, 255, .18), transparent 34%),
          radial-gradient(circle at 84% 82%, rgba(113, 102, 232, .14), transparent 36%),
          #f5f5f7;
      }
      .mark {
        width: 84px; height: 84px; display: grid; place-items: center; border-radius: 26px;
        color: #fff; font-size: 38px; font-weight: 750; letter-spacing: -.04em;
        background: linear-gradient(145deg, #52b8ff, #7166e8);
        box-shadow: 0 18px 42px rgba(62, 107, 210, .22), inset 0 1px 0 rgba(255,255,255,.55);
      }
      h1 { margin: 22px 0 6px; font-size: 27px; line-height: 1.2; letter-spacing: -.02em; }
      p { margin: 0; color: #7b8495; font-size: 15px; line-height: 1.5; }
      .dots { display: flex; gap: 7px; margin-top: 24px; }
      .dots i { width: 7px; height: 7px; border-radius: 50%; background: #1677ff; animation: pulse 1.15s infinite ease-in-out; }
      .dots i:nth-child(2) { animation-delay: .15s; }
      .dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes pulse { 0%, 65%, 100% { opacity: .24; transform: scale(.78); } 35% { opacity: 1; transform: scale(1); } }
      button {
        display: none; margin-top: 22px; min-width: 116px; min-height: 44px; padding: 0 20px;
        border: 0; border-radius: 22px; background: #1677ff; color: #fff; font: inherit; font-weight: 600;
      }
      iframe { position: fixed; width: 1px; height: 1px; left: -9999px; top: -9999px; border: 0; opacity: 0; }
      @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
    </style>
  </head>
  <body>
    <main class="boot">
      <div class="mark" aria-hidden="true">H</div>
      <h1>Home OS</h1>
      <p id="boot-status">正在打开个人管家…</p>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <button id="boot-retry" type="button">重新连接</button>
    </main>
    <iframe id="home-os-preload" title="Home OS 预加载" aria-hidden="true" tabindex="-1"></iframe>
    <script>
      const HOME_OS_URL = "https://life-manager-1.onrender.com/";
      const statusNode = document.getElementById("boot-status");
      const retryButton = document.getElementById("boot-retry");
      const preloadFrame = document.getElementById("home-os-preload");
      let entering = false;
      let slowTimer;

      function getTargetUrl() {
        const target = new URL(HOME_OS_URL);
        target.searchParams.set("source", "ios");
        target.searchParams.set("boot", String(Date.now()));
        target.hash = window.location.hash || "#home";
        return target.toString();
      }

      function enterHomeOS() {
        if (entering) return;
        entering = true;
        window.clearTimeout(slowTimer);
        statusNode.textContent = "正在进入 Home OS…";
        window.setTimeout(() => window.location.replace(getTargetUrl()), 100);
      }

      function preloadHomeOS() {
        retryButton.style.display = "none";
        statusNode.textContent = "正在打开个人管家…";
        preloadFrame.onload = () => window.setTimeout(enterHomeOS, 120);
        preloadFrame.src = getTargetUrl();
        slowTimer = window.setTimeout(() => {
          if (entering) return;
          statusNode.textContent = "网络连接较慢，仍在尝试加载";
          retryButton.style.display = "inline-block";
        }, 10000);
      }

      retryButton.addEventListener("click", () => {
        preloadFrame.src = "about:blank";
        window.setTimeout(preloadHomeOS, 80);
      });
      preloadHomeOS();
    </script>
  </body>
</html>
