<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生活管家</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E6F5">
<meta name="apple-mobile-web-app-title" content="生活管家">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;background:#F2F2F7;color:#1C1C1E;line-height:1.5;min-height:100vh;padding-bottom:90px}
.app{max-width:420px;margin:0 auto;background:#F2F2F7;min-height:100vh;position:relative}

/* ========= Header with gradient (顶部安全区自适应，配合真实状态栏) ========= */
.hero{background:linear-gradient(180deg,#E8E6F5 0%,#F2F2F7 100%);padding:calc(env(safe-area-inset-top, 20px) + 12px) 20px 24px;position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero-title{font-size:24px;font-weight:700;color:#1C1C1E;letter-spacing:-0.3px}
.hero-sub{font-size:13px;color:#8E8E93;margin-top:2px}
.settings-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;outline:none;backdrop-filter:blur(10px)}

/* ========= Summary Card ========= */
.summary-card{background:#F5F5F7;border-radius:14px;padding:16px;margin:0 16px;margin-top:-8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.summary-left .num{font-size:26px;font-weight:700;color:#1C1C1E;letter-spacing:-0.5px}
.summary-left .num span{font-size:15px;font-weight:500;color:#1C1C1E;margin-left:2px}
.summary-left .meta{font-size:12px;color:#8E8E93;margin-top:2px}
.summary-right{text-align:right}
.summary-right .icons{display:flex;gap:4px;justify-content:flex-end;margin-bottom:4px}
.summary-right .icons .ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.summary-right .meta{font-size:11px;color:#8E8E93}

/* ========= Content ========= */
.content{padding:20px 16px 0}

/* ========= Section Header ========= */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:20px;font-weight:700;color:#1C1C1E;letter-spacing:-0.3px}
.sec-filters{display:flex;gap:8px;align-items:center}
.filter-chip{padding:6px 12px;border-radius:14px;background:#fff;color:#1C1C1E;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #E5E5EA;outline:none}
.filter-chip.active{background:#1C1C1E;color:#fff;border-color:#1C1C1E}
.sort-btn{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid #E5E5EA;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1C1C1E;font-size:14px}

/* ========= Item Cards (兑换卡片风格) ========= */
.item-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.item-info{display:flex;gap:10px;align-items:center}
.item-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.item-info .name{font-size:15px;font-weight:600;color:#1C1C1E}
.item-info .meta{font-size:11px;color:#8E8E93;margin-top:1px}
.item-right{text-align:right}
.item-right .big{font-size:16px;font-weight:700;color:#1C1C1E}
.item-right .big span{font-size:11px;font-weight:400;color:#8E8E93;margin-left:2px}
.item-right .sub{font-size:11px;color:#8E8E93;margin-top:2px}

/* Bar Chart */
.chart{display:flex;align-items:flex-end;gap:2px;height:36px;margin:8px 0}
.chart .bar{flex:1;background:#007AFF;border-radius:2px 2px 0 0;min-height:2px;opacity:0.85}
.chart.orange .bar{background:#FF9500}
.chart.green .bar{background:#34C759}

.item-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.mini-tag{font-size:10px;color:#8E8E93;padding:2px 6px;border-radius:4px;background:#F5F5F7}
.mini-tag.warn{background:#FFF4E5;color:#FF9500}
.mini-tag.danger{background:#FFEBEC;color:#FF3B30}
.action-btn{padding:8px 16px;border-radius:10px;background:#007AFF;color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;outline:none}
.action-btn:hover{background:#0062CC}

/* ========= List style (module pages) ========= */
.list-card{background:#fff;border-radius:14px;padding:6px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F2F2F7}
.list-row:last-child{border-bottom:none}
.list-row .check{width:22px;height:22px;border-radius:50%;background:#007AFF;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0}
.list-row .check.empty{background:#fff;border:2px solid #E5E5EA}
.list-row .info{flex:1;min-width:0}
.list-row .name{font-size:14px;color:#1C1C1E;font-weight:500}
.list-row .meta{font-size:11px;color:#8E8E93;margin-top:2px}
.list-row .tag-mini{padding:2px 6px;border-radius:4px;font-size:10px;background:#F5F5F7;color:#8E8E93}
.list-row .tag-mini.warn{background:#FFF4E5;color:#FF9500}
.list-row .tag-mini.danger{background:#FFEBEC;color:#FF3B30}
.list-row .actions{display:flex;gap:2px}
.list-row .act-btn{background:none;border:none;color:#C7C7CC;cursor:pointer;font-size:14px;padding:4px 6px}
.list-row .act-btn:hover{color:#1C1C1E}

.empty-state{text-align:center;padding:40px 20px;color:#C7C7CC;font-size:14px}
.empty-state .icon{font-size:48px;display:block;margin-bottom:8px;opacity:0.4}

/* ========= Filter pills row ========= */
.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{display:none}
.filter-row .pill{padding:8px 16px;border-radius:18px;background:#fff;color:#1C1C1E;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #E5E5EA;outline:none;white-space:nowrap}
.filter-row .pill.active{background:#1C1C1E;color:#fff;border-color:#1C1C1E}

/* ========= Page ========= */
.page{display:none}.page.active{display:block}

/* ========= Bottom Nav ========= */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #E5E5EA;display:flex;padding:8px 0 calc(env(safe-area-inset-bottom, 0px) + 20px);z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;outline:none;padding:4px 0;color:#8E8E93;font-size:11px}
.nav-item .icon{font-size:22px}
.nav-item.active{color:#007AFF}

/* ========= FAB ========= */
.fab{position:fixed;bottom:96px;right:50%;transform:translateX(calc(50vw - 36px));max-width:calc(420px - 36px);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#007AFF,#0051D5);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 6px 16px rgba(0,122,255,0.35);z-index:40;display:flex;align-items:center;justify-content:center;outline:none}

/* ========= Modal ========= */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#F2F2F7;border-radius:14px 14px 0 0;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:8px 16px 24px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#C7C7CC;border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:20px;font-weight:700;color:#1C1C1E;text-align:center;margin-bottom:16px;letter-spacing:-0.3px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:#8E8E93;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 14px;border:none;border-radius:10px;background:#fff;font-size:15px;color:#1C1C1E;outline:none;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;margin-top:18px}
.form-actions button{flex:1}
.btn-cancel{padding:12px;border-radius:12px;background:#fff;color:#1C1C1E;border:none;font-size:15px;cursor:pointer}
.btn-save{padding:12px;border-radius:12px;background:#007AFF;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer}

.list-editor{background:#fff;border-radius:10px;padding:10px}
.list-editor .ing-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:14px}
.list-editor .ing-row .x{color:#FF3B30;cursor:pointer;font-size:16px;width:20px;text-align:center}
.list-editor .ing-add{display:flex;gap:6px;margin-top:6px}
.list-editor .ing-add input{flex:1;padding:8px 12px;border:none;border-radius:8px;background:#F5F5F7;font-size:13px;outline:none;color:#1C1C1E}
.list-editor .ing-add button{padding:8px 14px;border-radius:8px;background:#007AFF;color:#fff;border:none;font-size:12px;font-weight:500;cursor:pointer}

/* ========= Performance/Stats pages ========= */
.stat-block{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.stat-block h3{font-size:14px;font-weight:600;color:#1C1C1E;margin-bottom:12px}
.stat-block .big-num{font-size:32px;font-weight:700;color:#1C1C1E;letter-spacing:-0.5px}
.stat-block .big-num span{font-size:14px;font-weight:400;color:#8E8E93;margin-left:4px}
</style>
</head>
<body>

<div class="app">

  <!-- ========= Home Page ========= -->
  <div id="page-home" class="page active">

    <!-- Hero with gradient (顶部安全区自适应真实状态栏) -->
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-title">生活管家 🌿</div>
          <div class="hero-sub">每日凌晨 3 点数据重置</div>
        </div>
        <button class="settings-btn" onclick="alert('设置面板')">⚙</button>
      </div>
    </div>

    <!-- Summary Card -->
    <div class="summary-card">
      <div class="summary-left">
        <div class="num"><span id="s-total">0</span><span>件物品</span></div>
        <div class="meta">今日新增 0 件</div>
      </div>
      <div class="summary-right">
        <div class="icons">
          <div class="ico" style="background:#34C759">🥬</div>
          <div class="ico" style="background:#FF9500">🐾</div>
          <div class="ico" style="background:#FF2D55">📖</div>
        </div>
        <div class="meta">3 类在管</div>
      </div>
    </div>

    <div class="content">

      <!-- 兑换 / 临期提醒 section -->
      <div class="sec-head">
        <div class="sec-title">临期提醒</div>
        <div class="sec-filters">
          <button class="filter-chip active">全部</button>
          <button class="filter-chip">3天内</button>
          <button class="sort-btn">⇅</button>
        </div>
      </div>
      <div id="home-warnings"></div>

      <!-- 最近食谱 section -->
      <div class="sec-head" style="margin-top:24px">
        <div class="sec-title">最近食谱</div>
        <div class="sec-filters">
          <button class="filter-chip active">全部</button>
          <button class="filter-chip">家常</button>
          <button class="sort-btn">⇅</button>
        </div>
      </div>
      <div id="home-recipes"></div>

      <!-- 类别概览 -->
      <div class="sec-head" style="margin-top:24px">
        <div class="sec-title">数据概览</div>
      </div>
      <div id="home-stats"></div>

    </div>
  </div>

  <!-- ========= Ingredients Page ========= -->
  <div id="page-ingredients" class="page">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-title">食材管理</div>
          <div class="hero-sub">共 <span id="ing-count">0</span> 件食材</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="filter-row" id="ing-filters">
        <button class="pill active" data-cat="all">全部</button>
        <button class="pill" data-cat="蔬菜">蔬菜</button>
        <button class="pill" data-cat="水果">水果</button>
        <button class="pill" data-cat="肉类">肉类</button>
        <button class="pill" data-cat="海鲜">海鲜</button>
        <button class="pill" data-cat="调味品">调味品</button>
        <button class="pill" data-cat="其他">其他</button>
      </div>
      <div id="ingredient-list"></div>
    </div>
  </div>

  <!-- ========= Pets Page ========= -->
  <div id="page-pets" class="page">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-title">宠物用品</div>
          <div class="hero-sub">共 <span id="pet-count">0</span> 件用品</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="filter-row" id="pet-filters">
        <button class="pill active" data-cat="all">全部</button>
        <button class="pill" data-cat="食品">食品</button>
        <button class="pill" data-cat="玩具">玩具</button>
        <button class="pill" data-cat="清洁">清洁</button>
        <button class="pill" data-cat="医疗">医疗</button>
        <button class="pill" data-cat="其他">其他</button>
      </div>
      <div id="pet-list"></div>
    </div>
  </div>

  <!-- ========= Recipes Page ========= -->
  <div id="page-recipes" class="page">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-title">我的食谱</div>
          <div class="hero-sub">共 <span id="rec-count">0</span> 道食谱</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="filter-row" id="rec-filters">
        <button class="pill active" data-cat="all">全部</button>
        <button class="pill" data-cat="家常菜">家常菜</button>
        <button class="pill" data-cat="汤羹">汤羹</button>
        <button class="pill" data-cat="主食">主食</button>
        <button class="pill" data-cat="甜品">甜品</button>
        <button class="pill" data-cat="烘焙">烘焙</button>
      </div>
      <div id="recipe-list"></div>
    </div>
  </div>

  <!-- ========= Performance / 表现 Page ========= -->
  <div id="page-stats" class="page">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-title">数据概览</div>
          <div class="hero-sub">所有数据一目了然</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="stat-block">
        <h3>📊 物品总量</h3>
        <div class="big-num"><span id="st-total">0</span><span>件</span></div>
      </div>
      <div class="stat-block">
        <h3>🥬 食材明细</h3>
        <div class="big-num"><span id="st-ing">0</span><span>件</span></div>
      </div>
      <div class="stat-block">
        <h3>🐾 宠物用品</h3>
        <div class="big-num"><span id="st-pet">0</span><span>件</span></div>
      </div>
      <div class="stat-block">
        <h3>📖 食谱收藏</h3>
        <div class="big-num"><span id="st-rec">0</span><span>道</span></div>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="quickAdd()">+</button>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span class="icon">🏠</span><span>首页</span>
    </button>
    <button class="nav-item" data-page="ingredients">
      <span class="icon">🥬</span><span>食材</span>
    </button>
    <button class="nav-item" data-page="pets">
      <span class="icon">🐾</span><span>宠物</span>
    </button>
    <button class="nav-item" data-page="recipes">
      <span class="icon">📖</span><span>食谱</span>
    </button>
    <button class="nav-item" data-page="stats">
      <span class="icon">📊</span><span>数据</span>
    </button>
  </nav>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-title"></div>
      <form id="modal-form" onsubmit="return false;">

        <div id="fields-ingredient">
          <div class="form-group"><label>名称</label><input type="text" id="ing-name" required></div>
          <div class="form-group"><label>分类</label>
            <select id="ing-category">
              <option>蔬菜</option><option>水果</option><option>肉类</option><option>海鲜</option>
              <option>蛋奶</option><option>调味品</option><option>主食</option><option>其他</option>
            </select>
          </div>
          <div class="form-group"><label>数量</label><input type="text" id="ing-qty" placeholder="如 500g / 2个" required></div>
          <div class="form-group"><label>过期日期</label><input type="date" id="ing-expiry"></div>
          <div class="form-group"><label>备注</label><input type="text" id="ing-note"></div>
        </div>

        <div id="fields-pet" style="display:none">
          <div class="form-group"><label>名称</label><input type="text" id="pet-name" required></div>
          <div class="form-group"><label>分类</label>
            <select id="pet-category">
              <option>食品</option><option>玩具</option><option>清洁</option><option>医疗</option><option>窝具</option><option>其他</option>
            </select>
          </div>
          <div class="form-group"><label>数量</label><input type="text" id="pet-qty" required></div>
          <div class="form-group"><label>备注</label><input type="text" id="pet-note"></div>
        </div>

        <div id="fields-recipe" style="display:none">
          <div class="form-group"><label>食谱名称</label><input type="text" id="rec-name" required></div>
          <div class="form-group"><label>分类</label>
            <select id="rec-category">
              <option>家常菜</option><option>汤羹</option><option>主食</option><option>甜品</option><option>饮品</option><option>烘焙</option><option>其他</option>
            </select>
          </div>
          <div class="form-group"><label>烹饪时长</label><input type="text" id="rec-time" placeholder="如 15分钟"></div>
          <div class="form-group"><label>食材清单</label>
            <div class="list-editor" id="rec-ingredients-editor">
              <div class="ing-add">
                <input type="text" id="rec-ing-input" placeholder="输入食材后回车">
                <button type="button" onclick="addIngItem()">添加</button>
              </div>
            </div>
          </div>
          <div class="form-group"><label>烹饪步骤</label><textarea id="rec-steps" rows="3" placeholder="1. ..."></textarea></div>
          <div class="form-group"><label>备注</label><input type="text" id="rec-note"></div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
          <button type="button" class="btn-save" onclick="saveForm()">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'life_manager_v3';
function getData(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{ingredients:[],pets:[],recipes:[]}}catch{return{ingredients:[],pets:[],recipes:[]}}}
function saveData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d))}

let modalMode=null, editId=null;
let currentPage='home';
let ingFilter='all', petFilter='all', recFilter='all';

function goToPage(p){
  currentPage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===p));
  renderAll();
}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>goToPage(b.dataset.page)));

function quickAdd(){
  if(currentPage==='home'||currentPage==='stats') openModal('ingredient');
  else openModal(currentPage==='ingredients'?'ingredient':currentPage==='pets'?'pet':'recipe');
}

document.querySelectorAll('#ing-filters .pill').forEach(p=>p.addEventListener('click',function(){
  document.querySelectorAll('#ing-filters .pill').forEach(x=>x.classList.remove('active'));
  this.classList.add('active'); ingFilter=this.dataset.cat; renderIngredients();
}));
document.querySelectorAll('#pet-filters .pill').forEach(p=>p.addEventListener('click',function(){
  document.querySelectorAll('#pet-filters .pill').forEach(x=>x.classList.remove('active'));
  this.classList.add('active'); petFilter=this.dataset.cat; renderPets();
}));
document.querySelectorAll('#rec-filters .pill').forEach(p=>p.addEventListener('click',function(){
  document.querySelectorAll('#rec-filters .pill').forEach(x=>x.classList.remove('active'));
  this.classList.add('active'); recFilter=this.dataset.cat; renderRecipes();
}));

function openModal(type,id){
  modalMode=type; editId=id||null;
  document.getElementById('fields-ingredient').style.display=type==='ingredient'?'':'none';
  document.getElementById('fields-pet').style.display=type==='pet'?'':'none';
  document.getElementById('fields-recipe').style.display=type==='recipe'?'':'none';
  const t={ingredient:'食材',pet:'宠物用品',recipe:'食谱'};
  document.getElementById('modal-title').textContent=(editId?'编辑':'添加')+t[type];
  document.getElementById('modal-form').reset();
  document.querySelectorAll('#rec-ingredients-editor .ing-row').forEach(e=>e.remove());
  if(editId){
    const d=getData(); let arr=type==='ingredient'?d.ingredients:type==='pet'?d.pets:d.recipes;
    const it=arr.find(i=>i.id===editId); if(it){
      if(type==='ingredient'){
        ing_name.value=it.name||''; ing_category.value=it.category||'蔬菜';
        ing_qty.value=it.qty||''; ing_expiry.value=it.expiry||''; ing_note.value=it.note||'';
      } else if(type==='pet'){
        pet_name.value=it.name||''; pet_category.value=it.category||'食品';
        pet_qty.value=it.qty||''; pet_note.value=it.note||'';
      } else {
        rec_name.value=it.name||''; rec_category.value=it.category||'家常菜';
        rec_time.value=it.time||''; rec_steps.value=it.steps||''; rec_note.value=it.note||'';
        (it.ingredients||[]).forEach(v=>addIngItem(v));
      }
    }
  }
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');modalMode=null;editId=null}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

function addIngItem(text){
  const ed=document.getElementById('rec-ingredients-editor');
  const addLine=ed.querySelector('.ing-add');
  const row=document.createElement('div');
  row.className='ing-row';
  row.innerHTML='<span class="x" onclick="this.parentElement.remove()">✕</span><span>'+(text||'')+'</span>';
  if(text) ed.insertBefore(row,addLine);
}
document.getElementById('rec-ing-input').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&this.value.trim()){
    e.preventDefault();
    const ed=document.getElementById('rec-ingredients-editor');
    const addLine=ed.querySelector('.ing-add');
    const row=document.createElement('div');
    row.className='ing-row';
    row.innerHTML='<span class="x" onclick="this.parentElement.remove()">✕</span><span>'+this.value.trim()+'</span>';
    ed.insertBefore(row,addLine); this.value='';
  }
});

function saveForm(){
  const d=getData(); let item;
  const uid=()=>'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  if(modalMode==='ingredient'){
    const n=ing_name.value.trim(); if(!n){alert('请输入名称');return}
    item={id:editId||uid(),name:n,category:ing_category.value,qty:ing_qty.value.trim(),expiry:ing_expiry.value,note:ing_note.value.trim(),createdAt:Date.now()};
    if(editId){const i=d.ingredients.findIndex(x=>x.id===editId);if(i>-1)d.ingredients[i]=item}
    else d.ingredients.unshift(item);
  } else if(modalMode==='pet'){
    const n=pet_name.value.trim(); if(!n){alert('请输入名称');return}
    item={id:editId||uid(),name:n,category:pet_category.value,qty:pet_qty.value.trim(),note:pet_note.value.trim(),createdAt:Date.now()};
    if(editId){const i=d.pets.findIndex(x=>x.id===editId);if(i>-1)d.pets[i]=item}
    else d.pets.unshift(item);
  } else if(modalMode==='recipe'){
    const n=rec_name.value.trim(); if(!n){alert('请输入名称');return}
    const ings=[];
    document.querySelectorAll('#rec-ingredients-editor .ing-row span:last-child').forEach(el=>{if(el.textContent.trim())ings.push(el.textContent.trim())});
    item={id:editId||uid(),name:n,category:rec_category.value,time:rec_time.value.trim(),ingredients:ings,steps:rec_steps.value.trim(),note:rec_note.value.trim(),createdAt:Date.now()};
    if(editId){const i=d.recipes.findIndex(x=>x.id===editId);if(i>-1)d.recipes[i]=item}
    else d.recipes.unshift(item);
  }
  saveData(d); closeModal(); renderAll();
}

function deleteItem(type,id){
  if(!confirm('确定要删除吗？'))return;
  const d=getData();
  if(type==='ingredient')d.ingredients=d.ingredients.filter(x=>x.id!==id);
  else if(type==='pet')d.pets=d.pets.filter(x=>x.id!==id);
  else d.recipes=d.recipes.filter(x=>x.id!==id);
  saveData(d); renderAll();
}

function renderAll(){renderHome();renderIngredients();renderPets();renderRecipes();renderStats();}

function renderHome(){
  const d=getData();
  const total=d.ingredients.length+d.pets.length+d.recipes.length;
  document.getElementById('s-total').textContent=total;

  // 临期警告
  const warns=d.ingredients.filter(i=>{if(!i.expiry)return false;const diff=(new Date(i.expiry)-new Date())/864e5;return diff<=3});
  const wEl=document.getElementById('home-warnings');
  if(!warns.length){
    wEl.innerHTML='<div class="empty-state" style="padding:20px"><span class="icon">✅</span>暂无临期食材</div>';
  } else {
    wEl.innerHTML=warns.slice(0,5).map(i=>{
      const expired=new Date(i.expiry)<new Date();
      return `<div class="item-card">
        <div class="item-head">
          <div class="item-info">
            <div class="item-icon" style="background:#34C759">🥬</div>
            <div>
              <div class="name">${i.name}</div>
              <div class="meta">${i.category} · ${i.qty}</div>
            </div>
          </div>
          <div class="item-right">
            <div class="big">${i.expiry.slice(5)}<span>到期</span></div>
            <div class="sub">${expired?'已过期':'即将过期'}</div>
          </div>
        </div>
        <div class="chart"><div class="bar" style="height:${expired?8:18}px"></div><div class="bar" style="height:24px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:20px"></div><div class="bar" style="height:14px"></div></div>
        <div class="item-bottom">
          <div class="tags">${expired?'<span class="mini-tag danger">已过期</span>':'<span class="mini-tag warn">临期</span>'}</div>
          <button class="action-btn" onclick="goToPage('ingredients')">查看</button>
        </div>
      </div>`;
    }).join('');
  }

  // 最近食谱
  const rEl=document.getElementById('home-recipes');
  const recs=d.recipes.slice(0,3);
  if(!recs.length){
    rEl.innerHTML='<div class="empty-state" style="padding:20px"><span class="icon">📖</span>暂无食谱</div>';
  } else {
    rEl.innerHTML=recs.map(r=>`<div class="item-card">
      <div class="item-head">
        <div class="item-info">
          <div class="item-icon" style="background:#FF2D55">📖</div>
          <div>
            <div class="name">${r.name}</div>
            <div class="meta">${r.category} · ${r.ingredients.slice(0,2).join('、')}</div>
          </div>
        </div>
        <div class="item-right">
          <div class="big">${r.time||'—'}</div>
          <div class="sub">${r.ingredients.length} 种食材</div>
        </div>
      </div>
      <div class="chart orange"><div class="bar" style="height:8px"></div><div class="bar" style="height:14px"></div><div class="bar" style="height:22px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:18px"></div></div>
      <div class="item-bottom">
        <div class="tags"><span class="mini-tag">${r.time||'未设置时长'}</span></div>
        <button class="action-btn" onclick="goToPage('recipes')">查看</button>
      </div>
    </div>`).join('');
  }

  // 数据概览
  const stEl=document.getElementById('home-stats');
  stEl.innerHTML=`
    <div class="item-card">
      <div class="item-head">
        <div class="item-info">
          <div class="item-icon" style="background:#34C759">🥬</div>
          <div><div class="name">食材</div><div class="meta">已记录 ${d.ingredients.length} 件</div></div>
        </div>
        <div class="item-right"><div class="big">${d.ingredients.length}<span>件</span></div></div>
      </div>
    </div>
    <div class="item-card">
      <div class="item-head">
        <div class="item-info">
          <div class="item-icon" style="background:#FF9500">🐾</div>
          <div><div class="name">宠物用品</div><div class="meta">已记录 ${d.pets.length} 件</div></div>
        </div>
        <div class="item-right"><div class="big">${d.pets.length}<span>件</span></div></div>
      </div>
    </div>
  `;
}

function renderStats(){
  const d=getData();
  document.getElementById('st-total').textContent=d.ingredients.length+d.pets.length+d.recipes.length;
  document.getElementById('st-ing').textContent=d.ingredients.length;
  document.getElementById('st-pet').textContent=d.pets.length;
  document.getElementById('st-rec').textContent=d.recipes.length;
  document.getElementById('ing-count').textContent=d.ingredients.length;
  document.getElementById('pet-count').textContent=d.pets.length;
  document.getElementById('rec-count').textContent=d.recipes.length;
}

function renderIngredients(){
  const d=getData();
  let items=d.ingredients;
  if(ingFilter!=='all')items=items.filter(i=>i.category===ingFilter);
  const el=document.getElementById('ingredient-list');
  if(!items.length){el.innerHTML='<div class="empty-state"><span class="icon">🥬</span>还没有食材</div>';return}
  el.innerHTML=`<div class="list-card">`+items.map(i=>{
    const expired=i.expiry&&new Date(i.expiry)<new Date();
    const near=i.expiry&&!expired&&(new Date(i.expiry)-new Date())/864e5<=3;
    return `<div class="list-row">
      <div class="check ${expired?'empty':''}">${expired?'!':'✓'}</div>
      <div class="info">
        <div class="name">${i.name}</div>
        <div class="meta">${i.qty||'—'}${i.expiry?' · '+i.expiry:''}${i.note?' · '+i.note:''}</div>
      </div>
      ${expired?'<span class="tag-mini danger">已过期</span>':near?'<span class="tag-mini warn">临期</span>':'<span class="tag-mini">'+i.category+'</span>'}
      <div class="actions">
        <button class="act-btn" onclick="openModal('ingredient','${i.id}')">✎</button>
        <button class="act-btn" onclick="deleteItem('ingredient','${i.id}')">🗑</button>
      </div>
    </div>`;
  }).join('')+`</div>`;
}

function renderPets(){
  const d=getData();
  let items=d.pets;
  if(petFilter!=='all')items=items.filter(i=>i.category===petFilter);
  const el=document.getElementById('pet-list');
  if(!items.length){el.innerHTML='<div class="empty-state"><span class="icon">🐾</span>还没有宠物用品</div>';return}
  el.innerHTML=`<div class="list-card">`+items.map(i=>`<div class="list-row">
    <div class="check empty"></div>
    <div class="info">
      <div class="name">${i.name}</div>
      <div class="meta">${i.qty||'—'}${i.note?' · '+i.note:''}</div>
    </div>
    <span class="tag-mini">${i.category}</span>
    <div class="actions">
      <button class="act-btn" onclick="openModal('pet','${i.id}')">✎</button>
      <button class="act-btn" onclick="deleteItem('pet','${i.id}')">🗑</button>
    </div>
  </div>`).join('')+`</div>`;
}

function renderRecipes(){
  const d=getData();
  let items=d.recipes;
  if(recFilter!=='all')items=items.filter(i=>i.category===recFilter);
  const el=document.getElementById('recipe-list');
  if(!items.length){el.innerHTML='<div class="empty-state"><span class="icon">📖</span>还没有食谱</div>';return}
  el.innerHTML=items.map(i=>`<div class="item-card" style="margin-bottom:12px">
    <div class="item-head">
      <div class="item-info">
        <div class="item-icon" style="background:#FF2D55">📖</div>
        <div>
          <div class="name">${i.name}</div>
          <div class="meta">${i.category}${i.time?' · ⏱ '+i.time:''}</div>
        </div>
      </div>
      <div class="actions">
        <button class="act-btn" onclick="openModal('recipe','${i.id}')">✎</button>
        <button class="act-btn" onclick="deleteItem('recipe','${i.id}')">🗑</button>
      </div>
    </div>
    ${i.ingredients.length?`<div class="chart green"><div class="bar" style="height:10px"></div><div class="bar" style="height:18px"></div><div class="bar" style="height:24px"></div><div class="bar" style="height:30px"></div><div class="bar" style="height:20px"></div></div>`:''}
    ${i.ingredients.length?`<div style="font-size:12px;color:#8E8E93;margin:8px 0">🧾 ${i.ingredients.join('、')}</div>`:''}
    ${i.steps?`<div style="font-size:13px;color:#1C1C1E;white-space:pre-line;padding-top:6px;border-top:1px solid #F2F2F7">${i.steps}</div>`:''}
    ${i.note?`<div style="font-size:12px;color:#8E8E93;margin-top:6px">📌 ${i.note}</div>`:''}
  </div>`).join('');
}

renderAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(err) {
      console.log('SW 注册失败:', err);
    });
  });
}
</script>
</body>
</html>
