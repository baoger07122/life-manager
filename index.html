      <style>
        .home-os-web-boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f5f5f7; color: #171a22; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
        .home-os-web-boot__mark { width: 70px; height: 70px; display: grid; place-items: center; border-radius: 22px; color: #fff; font-size: 32px; font-weight: 750; background: linear-gradient(145deg, #52b8ff, #7166e8); box-shadow: 0 16px 36px rgba(62,107,210,.2); }
        .home-os-web-boot strong { margin-top: 18px; font-size: 22px; }
        .home-os-web-boot span { margin-top: 8px; color: #7b8495; font-size: 14px; }
      </style>
      <div class="home-os-web-boot" aria-label="Home OS 正在加载">
        <div class="home-os-web-boot__mark" aria-hidden="true">H</div>

      </div>
